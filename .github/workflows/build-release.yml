name: Publish to NuGet

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build_and_publish:
    permissions:
      id-token: write
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore ARSoft.Tools.Net/ARSoft.Tools.Net.csproj

    - name: Build
      run: dotnet build ARSoft.Tools.Net/ARSoft.Tools.Net.csproj -c Release --no-restore

    - name: Pack
      run: dotnet pack ARSoft.Tools.Net/ARSoft.Tools.Net.csproj -c Release --no-build --output ./nupkg

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: perdub

    - name: Publish to NuGet
      # Берем созданный .nupkg и пушим его с помощью секрета NUGET_API_KEY
      run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate